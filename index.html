<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi Ma-thi-ơ · Bị chấm bằng bút đỏ</title>
<meta name="description" content="Mỗi lượt vào thi là một đề 30 câu ngẫu nhiên từ đề cương 300 câu Ma-thi-ơ. Đúng sai báo ngay, kèm vài câu cà khịa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f9;
  --sheet:#ffffff;
  --rule:#d9e1ee;
  --ink:#1a2745;
  --ink-soft:#56627d;
  --red:#d7263d;
  --red-bg:#fde8eb;
  --green:#14804f;
  --green-bg:#e3f5ec;
  --hi:#ffe45e;
  --shadow:0 1px 0 rgba(26,39,69,.06),0 10px 30px -12px rgba(26,39,69,.25);
  --font-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-pen:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10162a;--sheet:#182040;--rule:#2a3560;--ink:#e8ecf8;--ink-soft:#9aa6c7;
    --red:#ff5d73;--red-bg:#3a1b27;--green:#3ddc97;--green-bg:#12352a;--hi:#8a7a1a;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:17px;line-height:1.55;
  padding:20px 16px 56px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:660px;margin:0 auto}

/* sheet: lined exam paper with red margin */
.sheet{
  position:relative;background:var(--sheet);border-radius:6px;box-shadow:var(--shadow);
  padding:26px 22px 26px 58px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 32px;background-position:0 10px;
}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:var(--red);opacity:.55}
.sheet>*{position:relative}

h1,h2{font-weight:700;line-height:1.2;margin:0}
.title{font-size:clamp(28px,6vw,38px);letter-spacing:-.01em;background:var(--sheet);display:inline;padding:0 6px 0 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub{margin:10px 0 0;color:var(--ink-soft);background:var(--sheet);display:inline-block;padding-right:6px}
.pen{font-family:var(--font-pen);font-weight:700;color:var(--red);line-height:1.15}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.who{font-size:14px;color:var(--ink-soft)}
.who b{color:var(--ink)}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px}
.iconbtn:hover{border-color:var(--ink-soft)}

/* login */
.field{display:block;margin:28px 0 14px;background:var(--sheet);padding:2px 6px 2px 0}
.field span{display:block;font-weight:600;margin-bottom:6px}
.field input{
  width:100%;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--ink);border-radius:8px;
  background:var(--sheet);color:var(--ink);
}
.field input::placeholder{color:var(--ink-soft)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:2px solid var(--ink);background:var(--ink);color:var(--sheet);
  padding:12px 22px;border-radius:8px;font-weight:600;font-size:17px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--red)}
.btn:active{transform:none;box-shadow:none}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.rules{margin:26px 0 0;padding:0;list-style:none;background:var(--sheet);display:inline-block;padding-right:8px;color:var(--ink-soft);font-size:15px}
.rules li{margin:2px 0}

/* progress: 30 score boxes */
.score-row{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:0 0 18px;background:var(--sheet);padding:4px 6px 4px 0}
.cell{aspect-ratio:1;border:1.5px solid var(--rule);border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.cell.now{border-color:var(--ink);box-shadow:0 0 0 2px var(--hi)}
.cell.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.cell.no{border-color:var(--red);background:var(--red-bg);color:var(--red)}

/* question */
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-soft);margin-bottom:8px;background:var(--sheet);padding:2px 6px 2px 0}
.q{font-size:clamp(19px,4.4vw,22px);font-weight:600;line-height:1.45;margin:0 0 18px;background:var(--sheet);padding:2px 6px 2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.opts{display:grid;gap:10px}
.opt{
  display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;
  width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);
  transition:transform .12s ease,background .12s ease,border-color .12s ease;
}
.opt .key{
  width:30px;height:30px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;
  font-weight:700;font-size:14px;margin-top:1px;
}
.opt:hover:not(:disabled){transform:translateX(3px);background:color-mix(in srgb,var(--hi) 35%,var(--sheet))}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.opt.dim{opacity:.55}
.opt .t{color:var(--ink)}
.opt.right .t,.opt.wrong .t{color:inherit}

/* feedback */
.fb{margin-top:18px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sheet);padding:12px 8px 12px 0}
.fb[hidden]{display:none}
.stamp{
  font-family:var(--font-pen);font-weight:700;font-size:44px;line-height:1;
  border:4px solid currentColor;border-radius:10px;padding:4px 14px 8px;transform:rotate(-7deg);
  animation:stamp .28s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.ok{color:var(--green)}
.stamp.no{color:var(--red)}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.note{font-size:clamp(23px,5vw,28px)}
.ref{grid-column:1/-1;font-size:14px;color:var(--ink-soft);border-top:1px dashed var(--rule);padding-top:8px}
.next{margin-top:14px;display:flex;justify-content:flex-end;background:var(--sheet);padding:4px 6px 4px 0}

/* result */
.grade{display:flex;align-items:center;gap:20px;margin:6px 0 4px;background:var(--sheet);padding:6px 8px 6px 0;flex-wrap:wrap}
.big{font-size:clamp(64px,18vw,92px);font-weight:700;letter-spacing:-.04em;line-height:1}
.big small{font-size:.38em;color:var(--ink-soft);font-weight:600;letter-spacing:0}
.verdict{font-size:clamp(26px,6vw,34px)}
.roast{margin:8px 0 18px;font-size:18px;background:var(--sheet);display:inline;padding:0 6px 0 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;background:var(--sheet);padding:4px 8px 4px 0}
details.review{background:var(--sheet);padding:8px 8px 8px 0;margin-top:6px}
details.review summary{cursor:pointer;font-weight:600}
.rv{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.rv li{border-left:4px solid var(--red);padding:2px 0 2px 12px;font-size:15px}
.rv .ans{color:var(--green);font-weight:600}

/* effects */
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(circle,transparent 35%,rgba(215,38,61,.45));animation:flash .5s ease-out both}
@keyframes flash{from{opacity:1}to{opacity:0}}
body.shake .wrap{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.rain{position:fixed;top:-40px;z-index:45;pointer-events:none;font-size:30px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(260deg);opacity:.9}}

@media (max-width:480px){
  .sheet{padding:20px 14px 22px 40px}
  .sheet::before{left:26px}
  .score-row{grid-template-columns:repeat(10,1fr)}
  .fb{grid-template-columns:1fr}
  .stamp{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="bar">
    <div class="who" id="who"></div>
    <button class="iconbtn" id="snd" type="button" aria-pressed="true">Âm thanh: bật</button>
  </div>
  <main class="sheet" id="app" aria-live="polite"></main>
</div>

<script>
"use strict";
const Q = [{"n":1,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Trước khi được Chúa Giê-xu kêu gọi làm môn đồ, tác giả sách Tin Lành Ma-thi-ơ làm nghề gì?","o":["Thu thuế","Đánh cá","Thầy thuốc","Thợ mộc"],"a":0,"r":"Ma-thi-ơ 9:9; 10:3. Đánh cá là nghề của Phi-e-rơ và Anh-rê; thầy thuốc là nghề của Lu-ca."},{"n":2,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Ma-thi-ơ còn có tên khác là gì?","o":["Gia-cơ","Lê-vi","Ba-na-ba","Ti-mô-thê"],"a":1,"r":"Mác 2:14; Lu-ca 5:27. Tên “Lê-vi” chỉ có trong Mác và Lu-ca, không có trong chính sách Ma-thi-ơ."},{"n":3,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Sách Tin Lành Ma-thi-ơ được viết gởi cho nhóm độc giả chính là:","o":["Người Hy Lạp","Người La-mã","Người Do Thái","Người Sa-ma-ri"],"a":2,"r":"Toàn sách. Sách trích Cựu Ước rất nhiều và mở đầu bằng gia phả từ Áp-ra-ham, Đa-vít."},{"n":4,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Sách Ma-thi-ơ gồm bao nhiêu chương?","o":["21","24","28","16"],"a":2,"r":"Toàn sách. 24 là số chương sách Lu-ca; 21 là số chương sách Giăng."},{"n":5,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Ma-thi-ơ là sách thứ mấy trong Tân Ước?","o":["Thứ nhất","Thứ tư","Thứ hai","Thứ ba"],"a":0,"r":"Toàn sách. Thứ tự bốn sách Tin Lành: Ma-thi-ơ, Mác, Lu-ca, Giăng."},{"n":6,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Sách Ma-thi-ơ ghi lại mấy bài giảng lớn của Chúa Giê-xu?","o":["Bảy","Năm","Ba","Chín"],"a":1,"r":"5–7; 10; 13; 18; 24–25. Mỗi bài thường kết thúc bằng “Khi Chúa Giê-xu phán xong những lời ấy” (7:28; 11:1; 13:53; 19:1; 26:1)."},{"n":7,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Trong Ma-thi-ơ, Chúa Giê-xu được nhấn mạnh trước hết là:","o":["Vua và Đấng Mê-si-a của dân Do Thái","Đầy tớ chịu khổ","Con Người hoàn hảo","Thầy tế lễ thượng phẩm đời đời"],"a":0,"r":"Toàn sách. Theo cách tóm tắt quen thuộc: Ma-thi-ơ là Vua, Mác là Đầy tớ, Lu-ca là Con Người, Giăng là Con Đức Chúa Trời."},{"n":8,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Cụm từ nào là đặc trưng, xuất hiện rất nhiều lần trong sách Ma-thi-ơ?","o":["Ngôi Lời","Nước thiên đàng","Ta là bánh sự sống","Ta là sự sống lại và sự sống"],"a":1,"r":"Toàn sách. Hai cụm còn lại là của sách Giăng."},{"n":9,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Ma-thi-ơ thường dùng cụm nào khi trích lời tiên tri Cựu Ước?","o":["Hãy nghe, hỡi Y-sơ-ra-ên","Thật, thật, Ta nói cùng các ngươi","Để ứng nghiệm lời Chúa đã phán qua đấng tiên tri","Theo lời truyền khẩu của các trưởng lão"],"a":2,"r":"1:22; 2:15; 2:17; 2:23. Nhấn mạnh Chúa Giê-xu là Đấng Mê-si-a được hứa."},{"n":10,"ch":"TỔNG QUAN SÁCH MA-THI-Ơ","q":"Gia phả trong Ma-thi-ơ bắt đầu từ:","o":["Nô-ê","Áp-ra-ham","A-đam","Môi-se"],"a":1,"r":"1:1-2. Gia phả trong Lu-ca đi ngược lên đến A-đam."},{"n":11,"ch":"CHƯƠNG 1","q":"Ma-thi-ơ 1:1 gọi Chúa Giê-xu là con cháu của hai người nào?","o":["Đa-vít và Áp-ra-ham","Áp-ra-ham và Gia-cốp","Môi-se và Đa-vít","Y-sác và Gia-cốp"],"a":0,"r":"1:1. Hai lời hứa lớn: giao ước với Áp-ra-ham và ngôi vua của Đa-vít."},{"n":12,"ch":"CHƯƠNG 1","q":"Gia phả Chúa Giê-xu được chia thành ba nhóm; mỗi nhóm có bao nhiêu đời?","o":["Hai mươi tám đời","Mười hai đời","Mười bốn đời","Bảy đời"],"a":2,"r":"1:17. Ba nhóm: từ Áp-ra-ham đến Đa-vít, từ Đa-vít đến lúc bị đày, từ lúc bị đày đến Đấng Christ."},{"n":13,"ch":"CHƯƠNG 1","q":"Hai mốc nào dùng để chia gia phả ở Ma-thi-ơ 1:17?","o":["Đa-vít và việc bị đày sang Ba-by-lôn","Môi-se và Giô-suê","Sa-lô-môn và Hê-rốt","A-đam và Nô-ê"],"a":0,"r":"1:17"},{"n":14,"ch":"CHƯƠNG 1","q":"Người phụ nữ nào dưới đây có tên trong gia phả Chúa Giê-xu ở Ma-thi-ơ 1?","o":["Ê-xơ-tê","Ru-tơ","Đê-bô-ra","Ê-li-sa-bét"],"a":1,"r":"1:5. Gia phả còn nhắc Ta-ma, Ra-háp và vợ của U-ri."},{"n":15,"ch":"CHƯƠNG 1","q":"Khi biết Ma-ri có thai, Giô-sép là người công chính nên định làm gì?","o":["Cưới nàng ngay lập tức","Tố cáo nàng trước công chúng","Âm thầm bỏ nàng","Đem nàng đến thầy tế lễ để xét xử"],"a":2,"r":"1:19. Ông không muốn làm nhục nàng."},{"n":16,"ch":"CHƯƠNG 1","q":"Thiên sứ báo cho Giô-sép đừng sợ rước Ma-ri về nhà bằng cách nào?","o":["Phán từ đám mây","Hiện ra giữa ban ngày","Hiện đến trong chiêm bao","Qua lời một thầy tế lễ"],"a":2,"r":"1:20. Giô-sép được nhắc là “con vua Đa-vít”."},{"n":17,"ch":"CHƯƠNG 1","q":"Vì sao thiên sứ truyền đặt tên con trẻ là Giê-xu?","o":["Vì Ngài sẽ ngồi trên ngai Đa-vít","Vì Ngài sẽ cứu dân mình ra khỏi tội","Vì Ngài sẽ giải phóng dân khỏi La-mã","Vì Ngài sẽ xây lại đền thờ"],"a":1,"r":"1:21. Tên Giê-xu có nghĩa là “Đức Giê-hô-va cứu rỗi”."},{"n":18,"ch":"CHƯƠNG 1","q":"Lời “Nầy, một nữ đồng trinh sẽ chịu thai…” do tiên tri nào nói?","o":["Ê-sai","Mi-chê","Giê-rê-mi","Đa-ni-ên"],"a":0,"r":"1:22-23. Em-ma-nu-ên nghĩa là Đức Chúa Trời ở cùng chúng ta."},{"n":19,"ch":"CHƯƠNG 2","q":"Chúa Giê-xu giáng sinh tại Bết-lê-hem trong đời vua nào?","o":["Hê-rốt","Ti-be-rơ","Nê-bu-cát-nết-sa","Phi-lát"],"a":0,"r":"2:1"},{"n":20,"ch":"CHƯƠNG 2","q":"Các nhà thông thái đến Giê-ru-sa-lem từ phương nào?","o":["Phương Nam","Phương Đông","Phương Bắc","Phương Tây"],"a":1,"r":"2:1"},{"n":21,"ch":"CHƯƠNG 2","q":"Các nhà thông thái nói họ đã thấy điều gì ở phương Đông?","o":["Thiên sứ hiện ra","Đám mây sáng trên đền thờ","Ngôi sao của Vua dân Giu-đa","Một đám lửa trên núi"],"a":2,"r":"2:2. Họ đến để thờ lạy Ngài."},{"n":22,"ch":"CHƯƠNG 2","q":"Ba lễ vật các nhà thông thái dâng cho Chúa Giê-xu là gì?","o":["Vàng, nhũ hương, một dược","Vàng, bạc, nhũ hương","Vàng, một dược, dầu thơm","Vàng, ngọc, nhũ hương"],"a":0,"r":"2:11. Kinh Thánh không nói rõ có bao nhiêu nhà thông thái."},{"n":23,"ch":"CHƯƠNG 2","q":"Vì sao các nhà thông thái về xứ mình bằng đường khác?","o":["Ngôi sao biến mất","Được báo trong chiêm bao đừng trở lại gặp Hê-rốt","Bị lính La-mã ngăn cản","Hê-rốt đã dặn họ đi đường khác"],"a":1,"r":"2:12"},{"n":24,"ch":"CHƯƠNG 2","q":"Để tránh Hê-rốt, gia đình Giô-sép chạy trốn sang:","o":["Sy-ri","Ba-by-lôn","Ai Cập","La-mã"],"a":2,"r":"2:13-14. Ứng nghiệm: “Ta đã gọi con trai Ta ra khỏi Ai Cập” (2:15)."},{"n":25,"ch":"CHƯƠNG 2","q":"Hê-rốt ra lệnh giết các bé trai ở Bết-lê-hem từ bao nhiêu tuổi trở xuống?","o":["Hai tuổi","Một tuổi","Ba tuổi function rnd(n){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(arr){ return arr[rnd(arr.length)]; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  "Đề cương 300 câu mà ôn kiểu này thì phí giấy in.",
  "Sai. Bạn vừa làm đáp án đúng cảm thấy bị xúc phạm.",
  "Ôi không. Ôi trời. Ôi {n}."
];
const STREAK_GOOD = {3:"3 câu liên tiếp? Hôm nay mặt trời mọc đằng Tây à?",5:"5 câu liền! Khoan, có gian lận không đấy?",10:"10 câu liền! Thôi đủ rồi, đừng làm tôi sợ.",15:"15 câu liền. Bạn là người hay là bản đề cương biết đi?"};
const STREAK_BAD = {3:"3 câu sai liên tiếp. Hay mình đóng tab đi?",5:"5 câu sai liền. Làm có chủ đích đúng không?",8:"8 câu sai liền. Thành tích này đáng vào sách kỷ lục.",12:"12 câu sai liền. Tôi bắt đầu thấy ngưỡng mộ sự kiên định này."};
const TIERS = [
  {min:30,title:"Thánh sống",txt:"Điểm tuyệt đối. Hoặc là thuộc cả đề cương, hoặc là lén mở sách. Tôi nghiêng về vế sau."},
  {min:27,title:"Giỏi, nhưng chưa đủ",txt:"Thiếu vài câu thôi. Vừa đủ để bị ghét, chưa đủ để được tôn thờ."},
  {min:24,title:"Khá ổn",txt:"Cũng được. Nhưng đừng vội ngạo mạn, ngày mai đề khác."},
  {min:20,title:"Đậu lẹt đẹt",txt:"Qua được, chưa đủ để khoe với ai. Mức an toàn của người ôn nửa vời."},
  {min:15,title:"Nửa nạc nửa mỡ",txt:"Lên không tới, xuống cũng không xong. Đọc lại các câu sai bên dưới đi."},
  {min:10,title:"Ôn bài hay ôn nhạc?",txt:"Thành tích này là một nỗi buồn có thật. Cuốn đề cương đang khóc ở góc nhà."},
  {min:5,title:"Thảm họa nhẹ",txt:"Thầy giáo xem điểm xong phải ngồi xuống uống nước. Làm lại ngay cho đỡ nhục."},
  {min:0,title:"Chiên lạc chính hiệu",txt:"Ít nhất bạn nhất quán: sai gần hết. Mở đề cương ra đọc rồi quay lại, tôi đợi."}
];

/* ---------- sound ---------- */
let audioCtx = null;
let soundOn = store.get("mt_sound", true);
function beep(freqs, dur=.12, type="sine", vol=.08){
  if (!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    let t = audioCtx.currentTime;
    freqs.forEach(f => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
      t += dur * .85;
    });
  }catch(e){}
}
const sfxGood = () => beep([660, 880, 1100], .11, "triangle");
const sfxBad = () => beep([220, 165, 110], .16, "sawtooth", .06);
function renderSound(){
  const b = $("#snd");
  b.textContent = "Âm thanh: " + (soundOn ? "bật" : "tắt");
  b.setAttribute("aria-pressed", String(soundOn));
}
$("#snd").addEventListener("click", () => { soundOn = !soundOn; store.set("mt_sound", soundOn); renderSound(); });
renderSound();

/* ---------- effects ---------- */
const cv = $("#fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function sizeCanvas(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confetti(x, y){
  if (reduceMotion) return;
  const colors = ["#14804f","#ffe45e","#d7263d","#2d5bd6","#ff8a3d","#8a4bd6"];
  for (let i = 0; i < 70; i++){
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, g: .32, r: 4 + Math.random() * 5,
      c: pick(colors), rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 70 + Math.random() * 40});
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  const k = devicePixelRatio;
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.rot += p.vr;
    cx.save(); cx.translate(p.x * k, p.y * k); cx.rotate(p.rot);
    cx.fillStyle = p.c; cx.globalAlpha = Math.min(1, p.life / 25);
    cx.fillRect(-p.r * k, -p.r * k * .5, p.r * 2 * k, p.r * k); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}
function disaster(){
  if (navigator.vibrate) { try{ navigator.vibrate(180); }catch(e){} }
  if (reduceMotion) return;
  document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake");
  const f = document.createElement("div"); f.className = "flash"; document.body.appendChild(f);
  setTimeout(() => f.remove(), 600);
  const em = ["🤡","💀","🤦","😭","🐑","📉","🙈"];
  for (let i = 0; i < 12; i++){
    const e = document.createElement("div"); e.className = "rain"; e.textContent = pick(em);
    e.style.left = (Math.random() * 94) + "vw"; e.style.animationDelay = (Math.random() * .5) + "s";
    document.body.appendChild(e); setTimeout(() => e.remove(), 2400);
  }
}

/* ---------- exam picking ---------- */
function buildExam(){
  const seen = new Set(store.get("mt_seen", []));
  let unseen = Q.filter(q => !seen.has(q.n));
  let chosen;
  if (unseen.length >= EXAM_SIZE){
    chosen = shuffle(unseen).slice(0, EXAM_SIZE);
  } else {
    chosen = unseen.slice();
    const rest = shuffle(Q.filter(q => !chosen.includes(q))).slice(0, EXAM_SIZE - chosen.length);
    chosen = chosen.concat(rest);
    seen.clear(); // 300 câu đã quay đủ vòng, bắt đầu vòng mới
    rest.forEach(q => seen.add(q.n));
    store.set("mt_seen", [...seen]);
    return finalize(chosen);
  }
  chosen.forEach(q => seen.add(q.n));
  store.set("mt_seen", [...seen]);
  return finalize(chosen);
}
function finalize(list){
  return shuffle(list).map(q => ({
    n: q.n, ch: q.ch, q: q.q, r: q.r,
    opts: shuffle(q.o.map((t, i) => ({t, ok: i === q.a})))
  }));
}
function viewedCount(){ return (store.get("mt_seen", [])).length; }

/* ---------- state ---------- */
let name = store.get("mt_name", "");
let exam = [], idx = 0, score = 0, results = [], goodStreak = 0, badStreak = 0, examId = "", locked = false;

function who(){
  $("#who").innerHTML = name ? "Thí sinh: <b>" + esc(name) + "</b>" : "";
}
function nm(){ return name || "bạn"; }
function say(t){ return t.replace(/\{n\}/g, nm()); }

/* ---------- screens ---------- */
function showLogin(){
  who();
  const seenN = viewedCount();
  $("#app").innerHTML = `
    <h1 class="title">Thi Ma-thi-ơ</h1><br>
    <p class="sub">30 câu ngẫu nhiên từ đề cương 300 câu. Sai là bị chấm bút đỏ.</p>
    <form id="lf" autocomplete="off">
      <label class="field"><span>Tên thí sinh</span>
        <input id="nm" maxlength="20" placeholder="Nhập tên để bị gọi cho đúng" value="${esc(name)}" required>
      </label>
      <button class="btn" type="submit">Vào thi</button>
    </form>
    <ul class="rules">
      <li>Mỗi lần vào thi là một đề mới, ưu tiên câu bạn chưa gặp.</li>
      <li>Chọn xong là biết đúng hay sai ngay, không sửa được.</li>
      <li>Phím A, B, C, D (hoặc 1 đến 4) để chọn, Enter để qua câu.</li>
      ${seenN ? `<li>Bạn đã gặp ${Math.min(seenN,300)}/300 câu trong vòng này.</li>` : ""}
    </ul>`;
  const inp = $("#nm"); inp.focus();
  $("#lf").addEventListener("submit", e => {
    e.preventDefault();
    name = inp.value.trim().slice(0, 20) || "bạn";
    store.set("mt_name", name);
    startExam();
  });
}

function startExam(){
  exam = buildExam(); idx = 0; score = 0; results = []; goodStreak = 0; badStreak = 0;
  examId = String(1000 + rnd(9000));
  who(); showQuestion();
}

function scoreRow(){
  let h = "";
  for (let i = 0; i < exam.length; i++){
    const r = results[i];
    const cls = r === undefined ? (i === idx ? "now" : "") : (r ? "ok" : "no");
    h += `<div class="cell ${cls}" aria-hidden="true">${r === undefined ? "" : (r ? "✓" : "✗")}</div>`;
  }
  return `<div class="score-row" role="img" aria-label="Đã làm ${results.length}/${exam.length} câu, đúng ${score}">${h}</div>`;
}

function showQuestion(){
  locked = false;
  const q = exam[idx];
  const chap = q.ch === "TỔNG QUAN SÁCH MA-THI-Ơ" ? "Tổng quan sách" : q.ch.replace("CHƯƠNG", "Chương");
  $("#app").innerHTML = `
    ${scoreRow()}
    <div class="meta"><span>Câu ${idx + 1}/${exam.length} · đề số ${examId}</span><span>${esc(chap)} · đúng ${score}</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    <div class="opts" id="opts">
      ${q.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="key">${LETTERS[i]}</span><span class="t">${esc(o.t)}</span></button>`).join("")}
    </div>
    <div class="fb" id="fb" hidden></div>
    <div class="next" id="nx" hidden></div>`;
  $("#opts").addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (b) choose(+b.dataset.i, e);
  });
  window.scrollTo({top: 0, behavior: reduceMotion ? "auto" : "smooth"});
}

function choose(i, ev){
  if (locked) return; locked = true;
  const q = exam[idx];
  const ok = q.opts[i].ok;
  results[idx] = ok;
  if (ok){ score++; goodStreak++; badStreak = 0; } else { badStreak++; goodStreak = 0; }

  document.querySelectorAll(".opt").forEach((b, k) => {
    b.disabled = true;
    if (q.opts[k].ok) b.classList.add("right");
    else if (k === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  let line = say(pick(ok ? GOOD : BAD));
  const st = ok ? STREAK_GOOD[goodStreak] : STREAK_BAD[badStreak];
  if (st) line = st;
  const ref = q.r ? `<div class="ref">Đối chiếu: ${esc(q.r)}</div>` : "";
  const fb = $("#fb");
  fb.hidden = false;
  fb.innerHTML = `<div class="stamp ${ok ? "ok" : "no"}">${ok ? "ĐÚNG" : "SAI"}</div><div class="note pen">${esc(line)}</div>${ref}`;
  const nx = $("#nx"); nx.hidden = false;
  const last = idx === exam.length - 1;
  nx.innerHTML = `<button class="btn" id="go" type="button">${last ? "Nộp bài, xem điểm" : "Câu tiếp"}</button>`;
  $("#go").addEventListener("click", next);
  $("#go").focus({preventScroll: true});
  fb.scrollIntoView({block: "nearest", behavior: reduceMotion ? "auto" : "smooth"});

  // refresh score row
  $(".score-row").outerHTML = scoreRow();

  if (ok){
    sfxGood();
    const r = (ev && ev.target && ev.target.getBoundingClientRect) ? ev.target.getBoundingClientRect() : null;
    confetti(r ? r.left + Math.min(r.width, 300) / 2 : innerWidth / 2, r ? r.top : innerHeight / 3);
  } else {
    sfxBad(); disaster();
  }
}

function next(){
  if (idx < exam.length - 1){ idx++; showQuestion(); }
  else showResult();
}

function showResult(){
  const tier = TIERS.find(t => score >= t.min);
  const pass = score >= PASS_MARK;
  const wrong = exam.map((q, i) => ({q, i})).filter(x => !results[x.i]);
  const mark = (score / exam.length * 10).toFixed(1).replace(".", ",");
  $("#app").innerHTML = `
    <h1 class="title">Kết quả đề số ${examId}</h1><br>
    <p class="sub">Thí sinh ${esc(nm())}</p>
    <div class="grade">
      <div class="big">${score}<small>/${exam.length}</small></div>
      <div>
        <div class="stamp ${pass ? "ok" : "no"}" style="display:inline-block">${pass ? "ĐẠT" : "RỚT"}</div>
      </div>
    </div>
    <div class="verdict pen">${esc(tier.title)} · ${mark}/10</div>
    <p class="roast">${esc(say(tier.txt))}</p>
    <div class="btns">
      <button class="btn" id="again" type="button">Làm đề mới</button>
      <button class="btn ghost" id="rename" type="button">Đổi tên thí sinh</button>
    </div>
    ${wrong.length ? `<details class="review" ${wrong.length <= 6 ? "open" : ""}>
      <summary>Xem lại ${wrong.length} câu sai</summary>
      <ul class="rv">${wrong.map(({q, i}) => {
        const right = q.opts.find(o => o.ok).t;
        return `<li><b>Câu ${i + 1}.</b> ${esc(q.q)}<br><span class="ans">Đáp án đúng: ${esc(right)}</span>${q.r ? `<br><span style="color:var(--ink-soft)">${esc(q.r)}</span>` : ""}</li>`;
      }).join("")}</ul>
    </details>` : `<p class="pen" style="font-size:26px;background:var(--sheet);display:inline-block;padding-right:6px">Không sai câu nào. Khả nghi quá.</p>`}`;
  $("#again").addEventListener("click", startExam);
  $("#rename").addEventListener("click", showLogin);
  $("#again").focus({preventScroll: true});
  window.scrollTo({top: 0});
  if (pass){ sfxGood(); confetti(innerWidth / 2, innerHeight / 3); confetti(innerWidth / 4, innerHeight / 2); confetti(innerWidth * .75, innerHeight / 2); }
  else { sfxBad(); }
}

/* ---------- keyboard ---------- */
addEventListener("keydown", e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const opts = document.querySelectorAll(".opt");
  if (opts.length && !locked){
    let i = "abcd".indexOf(k); if (i < 0) i = "1234".indexOf(k);
    if (i >= 0 && i < opts.length){ e.preventDefault(); opts[i].click(); return; }
  }
  if (locked && (k === "enter" || k === " ")){
    const go = $("#go"); if (go && document.activeElement !== go){ e.preventDefault(); go.click(); }
  }
});

showLogin();
</script>
</body>
</html>
